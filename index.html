<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081018">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Football Now">
  <meta name="description" content="サッカーニュースをすばやくチェックできるPWA">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon-180.png">
  <title>Football Now</title>
  <style>
    :root{
      --bg:#081018;--bg2:#0b0f14;--card:#121821;--card2:#171f2a;
      --text:#f4f7fb;--muted:#9aa7b6;--accent:#2f6bff;--barca-red:#a50044;--barca-blue:#004d98;--gold:#edbb00;--line:#22303d;
      --chip:#1b2632;--danger:#ff6b6b;--shadow:0 14px 38px rgba(0,0,0,.25)
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{background:var(--bg2)}
    body{
      margin:0;background:linear-gradient(180deg,#07142c 0%,#090d18 45%,#0b0f14 100%);
      color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
      padding-top:env(safe-area-inset-top);padding-bottom:calc(82px + env(safe-area-inset-bottom))
    }
    button,input{font:inherit}.app{max-width:560px;margin:0 auto;min-height:100vh}
    header{
      position:sticky;top:env(safe-area-inset-top);z-index:30;
      background:rgba(11,15,20,.9);backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,255,255,.06)
    }
    .topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
    .brand{font-size:20px;font-weight:950;letter-spacing:.35px;flex:1}
    .brand span{color:#edbb00}
    .iconbtn{
      width:42px;height:42px;border:1px solid var(--line);border-radius:14px;
      background:var(--card);color:#fff;font-size:18px;display:grid;place-items:center
    }
    .iconbtn:active,.chip:active,.nav:active,.refresh:active{transform:scale(.96)}
    .search{padding:0 16px 10px;display:none}
    .search.open{display:block}
    .search input{
      width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);
      background:var(--card2);color:white;outline:none;font-size:15px
    }
    .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 12px;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chip{
      border:0;white-space:nowrap;padding:9px 13px;border-radius:999px;
      background:var(--chip);color:#c7d0da;font-weight:800
    }
    .chip.active{background:linear-gradient(90deg,#004d98,#a50044);color:#fff}
    .hero{
      margin:16px;border-radius:24px;min-height:218px;overflow:hidden;position:relative;
      background:
        linear-gradient(180deg,rgba(3,10,24,.08) 0%,rgba(3,10,24,.28) 45%,rgba(5,8,18,.92) 100%),
        linear-gradient(90deg,rgba(0,77,152,.18),rgba(165,0,68,.18)),
        var(--hero-image) var(--hero-position, center 23%)/cover no-repeat;
      box-shadow:var(--shadow);
      min-height:310px
    }
    .hero::after{
      content:"5";position:absolute;left:15px;top:10px;font-size:118px;font-weight:950;opacity:.10;
      transform:rotate(-14deg)
    }
    .hero-content{position:absolute;left:18px;right:18px;bottom:18px;z-index:2}
    .badge{
      display:inline-flex;align-items:center;gap:6px;background:linear-gradient(90deg,#004d98,#a50044);color:#fff;
      font-size:11px;font-weight:950;padding:6px 9px;border-radius:8px;margin-bottom:9px
    }
    .hero h1{font-size:25px;line-height:1.17;margin:0 0 8px}
    .hero p{font-size:12px;line-height:1.55;color:#d3dbe3;margin:0}
    .status{
      margin:0 16px 12px;padding:11px 13px;border:1px solid var(--line);
      border-radius:15px;background:rgba(18,24,33,.8);color:var(--muted);
      font-size:12px;display:flex;align-items:center;gap:8px
    }
    .status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
    .toolbar{display:flex;align-items:center;justify-content:space-between;padding:2px 18px 11px}
    .toolbar h2{font-size:18px;margin:0}
    .toolbar-right{display:flex;align-items:center;gap:10px}
    #count{font-size:12px;color:var(--muted)}
    .refresh{
      border:0;background:transparent;color:#edbb00;font-weight:850;padding:5px
    }
    .feed{padding:0 14px}
    .news{
      display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;
      padding:11px;background:var(--card);border:1px solid var(--line);
      border-radius:19px;margin-bottom:10px;box-shadow:0 7px 20px rgba(0,0,0,.12);
      position:relative
    }
    .thumb{
      height:92px;border-radius:14px;overflow:hidden;background:
      linear-gradient(145deg,#1d2a37,#111821);position:relative
    }
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb-fallback{width:100%;height:100%;display:grid;place-items:center;font-size:34px}
    .tag{font-size:10px;color:#edbb00;font-weight:900;letter-spacing:.25px;margin-bottom:5px}
    .news h3{font-size:14px;line-height:1.4;margin:0 28px 7px 0}
    .news .meta{font-size:10.5px;color:var(--muted);line-height:1.4}
    .fav{
      position:absolute;right:9px;top:9px;width:32px;height:32px;border-radius:11px;
      border:1px solid var(--line);background:rgba(8,16,24,.82);color:#ccd5de;font-size:18px
    }
    .fav.on{color:#ffd34e}
    .empty{text-align:center;color:var(--muted);padding:46px 20px 80px;display:none}
    .empty b{display:block;color:white;font-size:18px;margin-bottom:7px}
    .skeleton{
      display:grid;grid-template-columns:104px 1fr;gap:12px;padding:11px;background:var(--card);
      border:1px solid var(--line);border-radius:19px;margin-bottom:10px
    }
    .sk{background:linear-gradient(90deg,#18212c,#212c38,#18212c);background-size:200% 100%;
      animation:shimmer 1.2s infinite;border-radius:10px}
    @keyframes shimmer{to{background-position:-200% 0}}
    .sk.img{height:92px}.sk.line{height:12px;margin:8px 0}.sk.line.short{width:54%}
    .bottom{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:min(560px,100%);height:calc(74px + env(safe-area-inset-bottom));
      padding-bottom:env(safe-area-inset-bottom);background:rgba(12,17,24,.96);
      backdrop-filter:blur(18px);border-top:1px solid var(--line);
      display:grid;grid-template-columns:repeat(4,1fr);z-index:40
    }
    .nav{border:0;background:none;color:#8c99a7;font-size:10px;font-weight:800}
    .nav b{display:block;font-size:20px;margin-bottom:2px}
    .nav.active{color:#edbb00}
    .toast{
      position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));
      transform:translateX(-50%) translateY(12px);background:#f3f7fa;color:#081018;
      padding:10px 14px;border-radius:999px;font-size:12px;font-weight:850;
      opacity:0;pointer-events:none;transition:.22s;z-index:60;white-space:nowrap
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    .xpanel{margin:0 14px 14px;padding:14px;border:1px solid var(--line);border-radius:19px;
      background:linear-gradient(135deg,rgba(0,77,152,.20),rgba(165,0,68,.13)),var(--card);display:none}
    .xpanel.show{display:block}
    .xhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
    .xhead b{font-size:15px}.xhead span{font-size:10px;color:var(--muted)}
    .xaccounts{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}
    .xaccounts::-webkit-scrollbar{display:none}
    .xaccount{min-width:158px;padding:12px;border-radius:15px;background:#0b111a;border:1px solid #253343;
      text-decoration:none;color:#fff}
    .xavatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
      background:linear-gradient(135deg,#004d98,#a50044);font-weight:950;margin-bottom:8px}
    .xaccount strong{display:block;font-size:12px;margin-bottom:3px}.xaccount small{color:#9aa7b6;font-size:10px}
    .xaccount .role{display:block;color:#edbb00;font-size:9px;font-weight:900;margin-top:7px}


    .matchesPage{display:none;padding:0 14px 20px}
    .matchesPage.show{display:block}
    .dateTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
    .dateTab{border:1px solid var(--line);background:var(--card);color:#aeb8c4;padding:10px 5px;border-radius:13px;font-weight:850}
    .dateTab.active{background:linear-gradient(90deg,#004d98,#a50044);color:#fff;border-color:transparent}
    .matchCard{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;padding:13px}
    .matchCard.barca{border-color:rgba(237,187,0,.55);box-shadow:0 0 0 1px rgba(237,187,0,.08) inset}
    .competition{font-size:10px;color:#9aa7b6;font-weight:800;margin-bottom:11px;display:flex;justify-content:space-between}
    .livePill{color:#fff;background:#b51f3b;padding:3px 7px;border-radius:7px;font-size:9px}
    .teams{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:8px;text-align:center}
    .team{font-size:13px;font-weight:850;line-height:1.25}
    .score{font-size:19px;font-weight:950;color:#fff}
    .kickoff{font-size:12px;font-weight:900;color:#edbb00}
    .matchState{text-align:center;color:#8f9aa7;font-size:10px;margin-top:9px}
    .matchHeader{display:flex;align-items:center;justify-content:space-between;margin-top:15px}
    .matchHeader h2{margin:0;font-size:20px}
    .matchRefresh{border:0;background:transparent;color:#edbb00;font-weight:850}
    .matchEmpty{text-align:center;color:#9aa7b6;padding:45px 15px}
    .officialBadge{font-size:9px;color:#edbb00;font-weight:900;margin-left:6px}.powered{text-align:center;font-size:10px;color:#778391;margin:18px 0}
    .powered a{color:#aeb8c4;text-decoration:none;font-weight:800}


    .matchDetail{display:none;padding:14px}
    .matchDetail.show{display:block}
    .detailTop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .backBtn{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:12px;padding:9px 12px;font-weight:850}
    .detailTitle{font-size:16px;font-weight:950}
    .detailScore{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;margin-bottom:14px}
    .detailTeams{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:8px}
    .detailTeams strong{font-size:14px}
    .pitch{position:relative;min-height:500px;border-radius:22px;overflow:hidden;
      background:
        linear-gradient(rgba(255,255,255,.18) 2px,transparent 2px),
        linear-gradient(90deg,rgba(255,255,255,.12) 2px,transparent 2px),
        linear-gradient(180deg,#176b3a,#0e542c);
      background-size:100% 25%,25% 100%,100% 100%;
      border:2px solid rgba(255,255,255,.5);margin:12px 0 16px}
    .pitch:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55)}
    .pitch:after{content:"";position:absolute;left:50%;top:50%;width:88px;height:88px;border:2px solid rgba(255,255,255,.55);border-radius:50%;transform:translate(-50%,-50%)}
    .lineupEmpty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#fff;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.5);z-index:3}
    .playerDot{position:absolute;transform:translate(-50%,-50%);z-index:4;text-align:center;width:76px}
    .playerDot button{width:42px;height:42px;border-radius:50%;border:2px solid #fff;background:#0b111a;color:#edbb00;font-weight:950}
    .playerDot span{display:block;font-size:9px;font-weight:850;margin-top:4px;text-shadow:0 1px 4px #000}
    .statsPanel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:18px}
    .statsPanel h3{margin:0 0 10px;font-size:15px}
    .statsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .statBox{background:#0b111a;border-radius:12px;padding:10px}
    .statBox small{display:block;color:#8f9aa7;font-size:9px}.statBox b{font-size:15px}


    .lineupBadge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;
      font-size:9px;font-weight:950;margin-left:6px}
    .lineupBadge.predicted{background:#6f5600;color:#ffe889}
    .lineupBadge.official{background:#0f5f3a;color:#a7ffd0}
    .lineupBadge.live{background:#7f1730;color:#fff}
    .formationLabel{text-align:center;font-size:11px;font-weight:900;color:#d8e1ea;margin:7px 0}
    .playerDot.predicted button{border-style:dashed;background:#151922;color:#ffe889}
    .playerDot.official button{background:#071d37;color:#edbb00}
    .playerDot .num{font-size:8px;color:#fff;opacity:.85}
    .playerSheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);
      width:min(560px,100%);background:#0d131c;border:1px solid var(--line);
      border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));
      z-index:80;transition:.25s;box-shadow:0 -20px 60px rgba(0,0,0,.45)}
    .playerSheet.show{transform:translate(-50%,0)}
    .sheetTop{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .sheetClose{border:0;background:#192330;color:#fff;width:36px;height:36px;border-radius:12px}
    .apiNote{background:#141c27;border:1px dashed #334457;border-radius:14px;padding:11px 12px;
      color:#9aa7b6;font-size:11px;line-height:1.55;margin-top:10px}


    .scheduleToolbar{margin:12px 0}
    .rangeTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
    .rangeBtn{border:1px solid var(--line);background:var(--card);color:#aeb8c4;border-radius:12px;padding:9px 5px;font-weight:900;font-size:11px}
    .rangeBtn.active{background:linear-gradient(90deg,#004d98,#a50044);border-color:transparent;color:#fff}
    .dateScroller{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}
    .dateScroller::-webkit-scrollbar{display:none}
    .dayBtn{min-width:62px;border:1px solid var(--line);background:var(--card);color:#aeb8c4;border-radius:14px;padding:8px 5px;font-weight:850}
    .dayBtn small{display:block;font-size:9px;margin-bottom:3px}.dayBtn b{font-size:13px}
    .dayBtn.active{background:#16283d;border-color:#edbb00;color:#fff}
    .calendarRow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
    .calendarWrap{flex:1;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:8px 11px}
    .calendarWrap input{width:100%;border:0;background:transparent;color:#fff;font:inherit}
    .scheduleMeta{font-size:10px;color:#8f9aa7;margin:5px 2px 10px}

    @media(min-width:700px){body{padding-top:20px}.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="topbar">
      <div class="brand">FOOTBALL <span>NOW</span></div>
      <button class="iconbtn" id="searchBtn" aria-label="検索">⌕</button>
    </div>
    <div class="search" id="searchBox">
      <input id="searchInput" type="search" placeholder="チーム名・選手名・大会名で検索">
    </div>
    <div class="chips" id="chips">
      <button class="chip active" data-cat="all">おすすめ</button>
      <button class="chip" data-cat="barca">バルセロナ</button>
      <button class="chip" data-cat="transfer">移籍</button>
      <button class="chip" data-cat="jleague">Jリーグ</button>
      <button class="chip" data-cat="europe">欧州</button>
      <button class="chip" data-cat="national">日本代表</button>
    </div>
  </header>

  <div id="homeContent">
  <section class="hero" id="hero">
    <div class="hero-content">
      <span class="badge">BARÇA EDITION</span>
      <h1>FOOTBALL NOW</h1>
      <p>BARÇA NEWS & MORE<br>最新情報を、速く、見やすく。</p>
    </div>
  </section>


  <section class="xpanel" id="xpanel">
    <div class="xhead"><b id="xTitle">BARÇA X</b><span>厳選情報源</span></div>
    <div class="xaccounts" id="xaccounts"></div>
  </section>

  <div class="status"><span class="dot"></span><span id="statusText">ニュースを取得しています…</span></div>

  <div class="toolbar">
    <h2 id="sectionTitle">最新ニュース</h2>
    <div class="toolbar-right">
      <span id="count">0件</span>
      <button class="refresh" id="refreshBtn">↻ 更新</button>
    </div>
  </div>

  <main class="feed" id="feed"></main>
  <div class="empty" id="empty"><b>ニュースが見つかりません</b>カテゴリーや検索ワードを変えてみてください。</div>
  </div>
  <section class="matchesPage" id="matchesPage">
    <div class="matchHeader"><h2>試合</h2><button class="matchRefresh" id="matchRefresh">↻ 更新</button></div>
    <div class="chips" id="leagueChips" style="padding:14px 0 2px">
      <button class="chip active" data-league="all">すべて</button>
      <button class="chip" data-league="jleague">Jリーグ</button>
      <button class="chip" data-league="world">海外</button>
      <button class="chip" data-league="friendly">親善試合</button>
    </div>
    <div class="scheduleToolbar">
      <div class="rangeTabs">
        <button class="rangeBtn active" data-range="day">1日</button>
        <button class="rangeBtn" data-range="week">7日間</button>
        <button class="rangeBtn" data-range="month">30日間</button>
      </div>
      <div class="calendarRow">
        <div class="calendarWrap"><input type="date" id="matchDatePicker" aria-label="試合日を選択"></div>
        <button class="rangeBtn" id="todayBtn" style="padding:10px 13px">今日</button>
      </div>
      <div class="dateScroller" id="dateScroller"></div>
      <div class="scheduleMeta" id="scheduleMeta"></div>
    </div>
    <div id="matchesFeed"><div class="matchEmpty">試合情報を取得しています…</div></div>
    <div class="powered">Data provided by <a href="https://www.football-data.org/" target="_blank" rel="noopener noreferrer">football-data.org</a></div>
  </section>
  <section class="matchDetail" id="matchDetail">
    <div class="detailTop"><button class="backBtn" id="backToMatches">← 試合一覧</button><div class="detailTitle">試合詳細</div></div>
    <div id="detailContent"></div>
  </section>
</div>

<div class="playerSheet" id="playerSheet">
  <div class="sheetTop"><div><div id="sheetPlayer" style="font-weight:950;font-size:17px"></div><div id="sheetTeam" style="color:#9aa7b6;font-size:11px;margin-top:3px"></div></div><button class="sheetClose" id="sheetClose">×</button></div>
  <div class="statsGrid" id="sheetStats" style="margin-top:14px"></div>
</div>
<nav class="bottom">
  <button class="nav active" data-view="home"><b>⌂</b>ホーム</button>
  <button class="nav" data-view="matches"><b>▤</b>試合</button>
  <button class="nav" data-view="favorites"><b>★</b>お気に入り</button>
  <button class="nav" data-view="settings"><b>⚙</b>設定</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const QUERIES = {
  all: 'サッカー OR football',
  barca: 'FC Barcelona OR バルセロナ OR Barça',
  transfer: 'サッカー 移籍 OR transfer football',
  jleague: 'Jリーグ サッカー',
  europe: '欧州サッカー プレミア ラリーガ セリエA ブンデスリーガ',
  national: 'サッカー 日本代表'
};


const X_SOURCES = {
  barca: [
    {name:'Reshad Rahman', handle:'ReshadRahman', role:'BARÇA NEWS'},
    {name:'Hermosa Cule', handle:'HermosaCule', role:'CULÉ SOURCE'},
    {name:'Football Cule', handle:'FootballCule', role:'BARÇA SOURCE'}
  ],
  transfer: [
    {name:'Fabrizio Romano', handle:'FabrizioRomano', role:'TRANSFER NEWS'}
  ]
};


const ENHANCED_API_BASE = 'https://football-now-api.leidou865.workers.dev';

let state = {
  category:'all',
  view:'home',
  articles:[],
  query:'',
  loading:false
};

const $ = s => document.querySelector(s);
const feed = $('#feed');
const empty = $('#empty');
const count = $('#count');
const statusText = $('#statusText');
const sectionTitle = $('#sectionTitle');
const searchBox = $('#searchBox');
const searchInput = $('#searchInput');
const toast = $('#toast');

function escapeHTML(s=''){
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function timeAgo(dateStr){
  const d = new Date(dateStr);
  if (Number.isNaN(d.getTime())) return '';
  const sec = Math.max(0, (Date.now()-d.getTime())/1000);
  if(sec < 60) return 'たった今';
  if(sec < 3600) return Math.floor(sec/60)+'分前';
  if(sec < 86400) return Math.floor(sec/3600)+'時間前';
  return Math.floor(sec/86400)+'日前';
}

function sourceName(item){
  if(item.author && item.author.trim()) return item.author.replace(/<[^>]+>/g,'').slice(0,28);
  try { return new URL(item.link).hostname.replace(/^www\./,''); } catch { return 'NEWS'; }
}

function articleId(a){
  let h=0, s=(a.link||a.title||'');
  for(let i=0;i<s.length;i++) h=((h<<5)-h)+s.charCodeAt(i)|0;
  return 'a'+Math.abs(h);
}

function normalizeItems(data){
  const items = Array.isArray(data.items) ? data.items : [];
  const normalized = items.map(x=>({
    title:(x.title||'').replace(/\s*-\s*[^-]+$/,'').trim(),
    link:x.link||x.guid||'#',
    pubDate:x.pubDate||x.published||'',
    author:x.author||'',
    thumbnail:x.thumbnail||x.enclosure?.link||'',
    description:(x.description||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()
  })).filter(x=>x.title && x.link && x.link!=='#')
    .sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));
  const recent = normalized.filter(x => {
    const t = new Date(x.pubDate).getTime();
    return Number.isFinite(t) && (Date.now()-t) < 1000*60*60*24*7;
  });
  return recent.length >= 5 ? recent : normalized;
}

async function fetchViaRss2Json(rssUrl){
  const url='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rssUrl);
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error('rss2json '+r.status);
  const d=await r.json();
  if(d.status && d.status!=='ok') throw new Error('rss2json failed');
  return normalizeItems(d);
}

async function fetchViaAllOrigins(rssUrl){
  const url='https://api.allorigins.win/raw?url='+encodeURIComponent(rssUrl);
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error('allorigins '+r.status);
  const xml=await r.text();
  const doc=new DOMParser().parseFromString(xml,'text/xml');
  return [...doc.querySelectorAll('item')].map(item=>({
    title:item.querySelector('title')?.textContent?.trim()||'',
    link:item.querySelector('link')?.textContent?.trim()||'',
    pubDate:item.querySelector('pubDate')?.textContent||'',
    author:item.querySelector('source')?.textContent||'',
    thumbnail:'',
    description:item.querySelector('description')?.textContent?.replace(/<[^>]*>/g,' ')||''
  })).filter(x=>x.title&&x.link);
}

  const rss='https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=ja&gl=JP&ceid=JP:ja';

  let items=[], mode='';
  try{

      if(cached){

  }

  if(items.length){
    state.articles=items.slice(0,30);
    localStorage.setItem('footballNowCache:'+state.category, JSON.stringify(state.articles));
    statusText.textContent = mode==='CACHE'
      ? '通信できないため、前回取得したニュースを表示中'

// J.LEAGUE official opening-round fixtures.
// These are used as a reliable fallback/merge so J1/J2/J3 do not disappear
// when the general live-score provider has incomplete Japanese coverage.
// V1.9: 試合日程は手入力せず、接続したデータAPIから自動取得します。

function localDateKey(date){
  if(!date) return '';
  const d = date instanceof Date ? date : new Date(date);
  if(Number.isNaN(d.getTime())) return '';
  const parts = new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'
  }).formatToParts(d);
  const get=t=>parts.find(p=>p.type===t)?.value||'';
  return `${get('year')}-${get('month')}-${get('day')}`;
}

function matchDate(m){
  const raw=m.starting_at||m.utcDate||m.date||m.start_time||m.startTime||m.kickoff||m.fixture?.date||null;
  if(!raw) return null;
  const d=new Date(raw);
  return Number.isNaN(d.getTime())?null:d;
}

function matchTeams(m){
  let home=m.home_team?.name||m.homeTeam?.name||m.home?.name||'';
  let away=m.away_team?.name||m.awayTeam?.name||m.away?.name||'';
  if((!home||!away)&&Array.isArray(m.participants)){
    const hp=m.participants.find(p=>String(p.meta?.location||'').toLowerCase()==='home');
    const ap=m.participants.find(p=>String(p.meta?.location||'').toLowerCase()==='away');
    if(!home) home=hp?.name||'';
    if(!away) away=ap?.name||'';
  }
  if((!home||!away)&&m.name){
    const parts=String(m.name).split(/\s+vs\.?\s+/i);
    if(parts.length>=2){
      if(!home) home=parts[0].trim();
      if(!away) away=parts.slice(1).join(' vs ').trim();
    }
  }
  return {home:home||'HOME',away:away||'AWAY'};
}

function scoreValue(m,side){
  const isHome=side==='home';
  const direct=isHome
    ? [m.scores?.home,m.home_score,m.homeScore,m.score?.home,m.score?.fullTime?.home,m.score?.fullTime?.homeTeam]
    : [m.scores?.away,m.away_score,m.awayScore,m.score?.away,m.score?.fullTime?.away,m.score?.fullTime?.awayTeam];
  for(const v of direct){
    if(v!==undefined&&v!==null&&v!=='') return v;
  }
  if(Array.isArray(m.scores)){
    const wanted=isHome?'home':'away';
    const sc=m.scores.find(x=>String(x.description||x.participant||x.location||x.score?.participant||'').toLowerCase().includes(wanted));
    const v=sc?.score?.goals??sc?.score?.score??sc?.goals??sc?.value;
    if(v!==undefined&&v!==null) return v;
  }
  return '';
}

function matchStatus(m){
  return String(m.status?.name||m.status||m.state||'').toLowerCase();
}
function dateKeyFromPicker(){
  return localDateKey(selectedMatchDate);
}
function rangeEndDate(){
  const x=new Date(selectedMatchDate);
  x.setDate(x.getDate()+(scheduleRange==='week'?6:scheduleRange==='month'?29:0));

function isInSelectedRange(d){

}

    html+=`<button class="dayBtn ${active?'active':''}" data-date="${key}"><small>${label}</small><b>${d.getMonth()+1}/${d.getDate()}</b></button>`;

function renderMatches(){
  const box=document.getElementById('matchesFeed');
  let list=matchCache.filter(m=>isInSelectedRange(matchDate(m)));
  if(matchLeagueFilter==='jleague') list=list.filter(m=>/J1|J2|J3|Ｊ１|Ｊ２|Ｊ３|J\.? League/i.test(String(m.competition?.name||m.competition||m.league?.name||m.league||'')));
  if(matchLeagueFilter==='world') list=list.filter(m=>!/J1|J2|J3|Ｊ１|Ｊ２|Ｊ３|J\.? League/i.test(String(m.competition?.name||m.competition||m.league?.name||m.league||'')));
  if(matchLeagueFilter==='friendly') list=list.filter(m=>m.friendly || /親善|friendly/i.test(String(m.competition?.name||m.competition||m.league?.name||m.league||'')));
  list.sort((a,b)=>{
    const ta=matchTeams(a),tb=matchTeams(b);

    return ba-bb || ((matchDate(a)?.getTime()||0)-(matchDate(b)?.getTime()||0));
  });
  const a=selectedMatchDate.toLocaleDateString('ja-JP',{month:'long',day:'numeric'});

  box.innerHTML=list.map(m=>{

    const done=/finished|final|ended|ft/.test(status);
    const isBarca=/barcelona|バルセロナ/i.test(t.home+' '+t.away);
    const middle=(live||done||hs!==''||as!=='')?`<div class="score">${hs===''?'-':hs} - ${as===''?'-':as}</div>`:
      `<div class="kickoff">${d?d.toLocaleTimeString('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}):'--:--'}</div>`;
    const comp=m.competition?.name||m.competition||m.league?.name||m.league||m.tournament?.name||'FOOTBALL';
    const globalIndex=matchCache.indexOf(m);
    return `<div class="matchCard ${isBarca?'barca':''}" data-match-index="${globalIndex}">
      <div class="competition"><span>${escapeHTML(String(comp))}${m.friendly?'<span class="officialBadge">FRIENDLY</span>':''}</span>${live?'<span class="livePill">LIVE</span>':''}</div>
      <div class="teams"><div class="team">${escapeHTML(t.home)}</div>${middle}<div class="team">${escapeHTML(t.away)}</div></div>
      <div class="matchState">${d?d.toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',month:'short',day:'numeric',weekday:'short'}):''}${live?' ・ 試合中':done?' ・ 試合終了':''}</div>
    </div>`;
  }).join('');
}
async function fetchScheduleRange(from,to){
  if(!ENHANCED_API_BASE) return [];
  try{
    const base=ENHANCED_API_BASE.replace(/\/$/,'');
    const r=await fetch(`${base}/fixtures?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    return Array.isArray(d.data)?d.data:(Array.isArray(d)?d:[]);
  }catch(e){ console.warn(e); return []; }
}

function extractLineupObjects(m){
  const expected = m.expectedlineups || m.expectedLineups || m.expected_lineups || [];
  const official = m.lineups || m.lineup || [];
  const confirmed = Boolean(m.lineup_confirmed || m.lineupConfirmed || official.length);
  return {expected:Array.isArray(expected)?expected:[], official:Array.isArray(official)?official:[], confirmed};
}
function normalizeLineupPlayer(x, kind='official'){
  const p=x.player||x;
  const grid=x.formation_field||x.grid||p.grid||null;
  const teamId=x.team_id||x.team?.id||p.team_id||null;
  return {
    id:p.id||x.player_id||p.player_id||null,
    name:p.display_name||p.name||x.player_name||p.player_name||'Player',
    number:p.jersey_number||p.number||x.jersey_number||'',
    grid,
    teamId,
    position:p.position?.name||p.position||p.pos||x.position_name||'',
    stats:x.statistics||x.stats||p.statistics||p.stats||{},
    kind
  };
}
function gridToXY(grid, isAway=false){
  if(!grid || !String(grid).includes(':')) return null;
  const [rowRaw,colRaw]=String(grid).split(':').map(Number);
  if(!rowRaw || !colRaw) return null;
  const row=Math.max(1,Math.min(5,rowRaw));
  const colsByRow={1:1,2:5,3:5,4:5,5:3};
  const cols=colsByRow[row]||5;
  const col=Math.max(1,Math.min(cols,colRaw));
  const x=(col/(cols+1))*100;
  let y=12 + (row-1)*9.5;
  if(isAway) y=100-y;
  return {x,y};
}
function renderLineupPitch(m){
  const {expected,official,confirmed}=extractLineupObjects(m);
  const source=confirmed && official.length ? official : expected;
  const kind=confirmed && official.length ? 'official':'predicted';
  if(!source.length){
    return `<div class="pitch"><div class="lineupEmpty">予想スタメン未取得<br><small style="font-weight:600">データAPI接続後は、予想 → 正式発表へ自動切替します</small></div></div>
      ${ENHANCED_API_BASE?'':'<div class="apiNote">いまはGitHub Pagesだけなので、スタメンの自動取得用バックエンドが未接続です。ZIP内の <b>worker.js</b> を接続すると予想・正式スタメン・選手スタッツを取得できます。</div>'}`;
  }
  const teams=matchTeams(m);
  const participants=m.participants||[];
  const homeId=m.home_team?.id||m.homeTeam?.id||participants.find(x=>x.meta?.location==='home')?.id||null;
  const awayId=m.away_team?.id||m.awayTeam?.id||participants.find(x=>x.meta?.location==='away')?.id||null;
  const players=source.map(x=>normalizeLineupPlayer(x,kind));
  const starters=players.filter((p,i)=>{
    const raw=source[i];
    const type=raw.type_id||raw.type||raw.lineup_type;
    if(kind==='predicted') return type===77614 || type==='starter' || raw.formation_position!=null || raw.formation_field;
    return raw.type_id===11 || raw.type==='startXI' || raw.type==='starter' || raw.formation_field || raw.formation_position!=null;
  }).slice(0,22);
  const points=starters.map((pl,i)=>{
    const isAway=awayId ? String(pl.teamId)===String(awayId) : i>=11;
    const pos=gridToXY(pl.grid,isAway);
    if(!pos) return '';
    const safeStats=encodeURIComponent(JSON.stringify(pl.stats||{}));
    return `<div class="playerDot ${kind}" style="left:${pos.x}%;top:${pos.y}%">
      <button data-player="${escapeHTML(pl.name)}" data-team="${escapeHTML(isAway?teams.away:teams.home)}" data-stats="${safeStats}">
        ${pl.number||'•'}
      </button>
      <span>${escapeHTML(pl.name.split(' ').slice(-1)[0])}</span>
    </div>`;
  }).join('');
  const badge=kind==='official'
    ? '<span class="lineupBadge official">✓ 正式スタメン</span>'
    : '<span class="lineupBadge predicted">予想スタメン</span>';
  return `<div class="formationLabel">${badge}</div><div class="pitch">${points||'<div class="lineupEmpty">配置データを取得中</div>'}</div>`;
}

    <div class="statsPanel">
      <h3>選手スタッツ</h3>
      <div style="color:#8f9aa7;font-size:12px;line-height:1.6">ピッチ上の選手をタップすると、その試合の個人スタッツを表示します。</div>
    </div>`;
  document.querySelectorAll('#detailContent .playerDot button').forEach(btn=>btn.addEventListener('click',()=>{
    let st={}; try{st=JSON.parse(decodeURIComponent(btn.dataset.stats||'%7B%7D'));}catch{}
    openPlayerSheet(btn.dataset.player,btn.dataset.team,st);
  }));
}
function showView(view){
  const home=document.getElementById('homeContent'), matches=document.getElementById('matchesPage'), detail=document.getElementById('matchDetail');
  detail.classList.remove('show');
  if(view==='matches'){home.style.display='none';matches.classList.add('show');loadMatches();}
  else{home.style.display='block';matches.classList.remove('show');}
}
document.querySelectorAll('#leagueChips .chip').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#leagueChips .chip').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); matchLeagueFilter=b.dataset.league; renderMatches();
}));

document.querySelectorAll('.rangeBtn[data-range]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.rangeBtn[data-range]').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active'); scheduleRange=btn.dataset.range; loadMatches();
}));
document.getElementById('matchDatePicker').value=dateKeyFromPicker();
document.getElementById('matchDatePicker').addEventListener('change',e=>{
  if(!e.target.value) return;
  selectedMatchDate=new Date(e.target.value+'T12:00:00+09:00');
  renderDateScroller(); loadMatches();
});
document.getElementById('todayBtn').addEventListener('click',()=>{
  selectedMatchDate=new Date();
  document.getElementById('matchDatePicker').value=dateKeyFromPicker();
  renderDateScroller(); loadMatches();
});
renderDateScroller();

document.getElementById('matchRefresh').addEventListener('click',loadMatches);

// 試合カードをタップして詳細を開く
document.getElementById('matchesFeed').addEventListener('click', e => {
  const card = e.target.closest('.matchCard');
  if(!card) return;
  const index = Number(card.dataset.matchIndex);
  if(Number.isInteger(index) && index >= 0) openMatchDetail(index);
});

// 詳細から試合一覧へ戻る
document.getElementById('backToMatches').addEventListener('click', () => {
  document.getElementById('matchDetail').classList.remove('show');
  document.getElementById('matchesPage').classList.add('show');
});

// 選手詳細シートを閉じる
document.getElementById('sheetClose').addEventListener('click', () => {
  document.getElementById('playerSheet').classList.remove('show');
});

document.querySelectorAll('.nav').forEach(nav=>nav.addEventListener('click',()=>{
  const view=nav.dataset.view;
  if(view==='settings'){showToast('設定ページは今後追加予定');return;}
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  nav.classList.add('active');
  state.view=view;
  showView(view);
  if(view==='home') render();
  if(view==='favorites') render();
}));

function setRandomBusquetsBackground(){
  const hero = document.getElementById('hero');
  if(!hero) return;
  let previous = Number(sessionStorage.getItem('footballNowLastBg') ?? -1);
  let next = Math.floor(Math.random() * BUSQUETS_BACKGROUNDS.length);
  if(BUSQUETS_BACKGROUNDS.length > 1 && next === previous){
    next = (next + 1 + Math.floor(Math.random() * (BUSQUETS_BACKGROUNDS.length - 1))) % BUSQUETS_BACKGROUNDS.length;
  }
  sessionStorage.setItem('footballNowLastBg', String(next));
  hero.style.setProperty('--hero-image', `url("${BUSQUETS_BACKGROUNDS[next]}")`);

  // Portrait images generally look better centered; wide images get a slightly higher crop.
  const probe = new Image();
  probe.onload = () => {
    const portrait = probe.naturalHeight > probe.naturalWidth;
    hero.style.setProperty('--hero-position', portrait ? 'center 20%' : 'center 28%');
  };
  probe.src = BUSQUETS_BACKGROUNDS[next];
}
setRandomBusquetsBackground();
